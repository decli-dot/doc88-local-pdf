name: Local application release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-application-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOC88_OCR_ENGINE: wasm
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read version and check for an existing release
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists != 'true'
        run: npm ci
      - if: steps.version.outputs.exists != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.version.outputs.exists != 'true'
        run: npm run check && npm run format:check && npm test
      - if: steps.version.outputs.exists != 'true'
        run: npm run package
      - name: Publish the verified local ZIP
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "release/doc88-local-pdf-$RELEASE_TAG.zip" \
            --target "$GITHUB_SHA" --title "DecliPDF $RELEASE_TAG" \
            --notes-file "docs/RELEASE-$RELEASE_TAG.md"
